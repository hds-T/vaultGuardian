<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VaultGuardian</title>
<link rel="stylesheet" href="/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M18.98 12.34h-1.01v-1.95a.39.39 0 0 0-.11-.27l-1.85-1.99a.36.36 0 0 0-.29-.13H4.26c-.11 0-.22.05-.29.13L2.11 10.12a.39.39 0 0 0-.11.27v2.84c0 .1.04.2.11.27l1.85 1.99c.08.08.18.13.3.13h17.45c.11 0 .22-.05.29-.13 0 0-2.8-3.15-3.02-3.15Zm-4.29-.4c0 .22-.18.4-.4.4H5.69a.4.4 0 0 1-.4-.4v-.25c0-.22.18-.4.4-.4h8.59c.11 0 .21.04.28.12l.01.01c.08.08.12.18.12.28v.24Z' fill='%2316E3C1'/></svg>" />
</head>
<body>

<!-- ===================== INTRO ===================== -->
<section id="intro">
  <div class="intro-inner">
    <div class="hero"><div class="mark"></div></div>
    <img class="intro-logo" src="/assets/logo.svg" alt="QVAC" />
    <h1 class="intro-title">Vault<em>Guardian</em></h1>
    <p class="intro-copy" data-i18n-html="intro.copy"></p>
    <p class="intro-copy intro-rules" data-i18n-html="intro.rules"></p>

    <!-- One CTA per language: the flag picks how you play, the label is
         written in the language it picks. -->
    <p class="lang-pick" data-i18n="intro.pick"></p>
    <div class="lang-cta" id="langCta">
      <button class="btn big lang" data-lang="ca" disabled>
        <img class="flag" src="/assets/flag-ca.svg" alt="" aria-hidden="true" />
        <span class="lang-label"></span>
      </button>
      <button class="btn big lang" data-lang="es" disabled>
        <img class="flag" src="/assets/flag-es.svg" alt="" aria-hidden="true" />
        <span class="lang-label"></span>
      </button>
      <button class="btn big lang" data-lang="en" disabled>
        <img class="flag" src="/assets/flag-gb.svg" alt="" aria-hidden="true" />
        <span class="lang-label"></span>
      </button>
    </div>

    <div class="intro-meta">
      <span id="introPill" class="pill">local model</span>
      <a class="pill" href="/admin" data-i18n="pill.admin">admin →</a>
    </div>
    <p class="footer-note" data-i18n="intro.footer"></p>
  </div>
</section>

<!-- ===================== GAME ===================== -->
<section id="game" class="hidden">
  <div class="wrap" style="padding-bottom:0">
    <header class="top">
      <div class="brand">
        <img class="intro-logo" src="/assets/logo.svg" alt="QVAC" style="height:16px;margin:0" />
        <div>
          <h1>VaultGuardian</h1>
          <p data-i18n="header.tagline"></p>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="modelPill" class="pill">local model</span>
        <a class="pill" href="/admin" data-i18n="pill.admin">admin →</a>
      </div>
    </header>
  </div>

  <div class="stage">
    <div class="levelbar">
      <span class="count" id="levelCount">Level 1 / 5</span>
      <span class="lname" id="levelName">—</span>
      <span class="spacer"></span>
      <span class="tries" id="tries"><b id="triesLeft">10</b> <span data-i18n="level.tries"></span></span>
      <div class="pips" id="pips"></div>
    </div>

    <p id="levelHint" class="levelhint hidden">
      <span class="lbl" data-i18n="level.hint"></span>
      <span id="levelHintText"></span>
    </p>

    <div class="board" id="board">
      <div id="msgs" class="msgs"></div>
    </div>

    <div class="composer">
      <input id="chatInput" data-i18n-placeholder="chat.placeholder" autocomplete="off" disabled />
      <button id="micBtn" class="btn ghost icon hidden" data-i18n-title="chat.mic" aria-label="" disabled>
        <span class="mic-icon" aria-hidden="true"></span>
      </button>
      <button id="sendBtn" class="btn" data-i18n="chat.send" disabled></button>
      <button id="resetBtn" class="btn ghost" data-i18n="chat.reset" data-i18n-title="chat.resetTitle" disabled></button>
    </div>

    <div class="guessbar">
      <span class="lbl" data-i18n="guess.label"></span>
      <input id="guessInput" data-i18n-placeholder="guess.placeholder" autocomplete="off" disabled />
      <button id="guessBtn" class="btn gold" data-i18n="guess.submit" disabled></button>
    </div>

    <div class="vault">
      <span class="lbl" data-i18n="vault.words"></span>
      <div id="words" class="pips" style="gap:8px"></div>
    </div>

    <div id="sttbar" class="sttbar hidden">
      <label class="lbl" for="sttLang" data-i18n="stt.label"></label>
      <!-- options are built from the languages the server reports -->
      <select id="sttLang" disabled></select>
      <span id="sttStatus" class="sttnote"></span>
    </div>
  </div>
</section>

<div id="toast" class="toast"></div>
<div id="resetToast" class="toast corner"></div>

<!-- ===================== CELEBRATION ===================== -->
<div id="confetti" class="confetti" aria-hidden="true"></div>
<div id="prizeModal" class="modal hidden">
  <div class="modal-backdrop" id="prizeBackdrop"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="prizeTitle">
    <div class="modal-sigil"></div>
    <h2 class="modal-title" id="prizeTitle"></h2>
    <p class="modal-copy" id="prizeText"></p>
    <button id="prizeBtn" class="btn big"></button>
  </div>
</div>
<div id="overModal" class="modal hidden">
  <div class="modal-backdrop" id="overBackdrop"></div>
  <div class="modal-card over" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <h2 class="modal-title" id="overTitle" data-i18n="over.title"></h2>
    <p class="modal-copy" id="overText"></p>
    <button id="overBtn" class="btn big" data-i18n="over.back"></button>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/confetti.js"></script>
<script src="/app.js"></script>
</body>
</html>
